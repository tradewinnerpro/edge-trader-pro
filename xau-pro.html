<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAU/USD Signal Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0e17;
            --surface: #111827;
            --border: rgba(255, 185, 70, 0.2);
            --gold: #ffb946;
            --green: #3dffa0;
            --red: #ff5e6b;
            --muted: #5a6a8a;
            --text: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 10px;
        }
        .header {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #ffb946, #d4952a);
            border-radius: 10px;
            display: grid; place-items: center;
            font-size: 18px;
        }
        .logo-text h1 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            color: var(--gold);
        }
        .btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--green);
            color: var(--green);
            background: transparent;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--muted);
            color: var(--muted);
        }
        .status.on { border-color: var(--green); color: var(--green); }
        .main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 10px;
        }
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 185, 70, 0.1);
            font-family: 'Syne', sans-serif;
            color: var(--gold);
        }
        #chart {
            width: 100%;
            height: 500px;
        }
        .signal {
            padding: 16px;
            text-align: center;
        }
        .signal-type {
            font-family: 'Syne', sans-serif;
            font-size: 26px;
            font-weight: 800;
            margin: 10px 0;
        }
        .signal-buy { color: var(--green); }
        .signal-sell { color: var(--red); }
        .signal-wait { color: var(--gold); }
        .levels {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            padding: 0 16px 16px;
        }
        .level {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 185, 70, 0.1);
            border-radius: 8px;
            padding: 8px;
            text-align: center;
        }
        .level-label { color: var(--muted); font-size: 9px; }
        .level-value { font-family: 'Syne', sans-serif; font-size: 14px; margin-top: 4px; }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .gold { color: var(--gold); }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">
                <h1>XAU/USD SIGNAL PRO</h1>
                <span style="color: var(--muted); font-size: 9px;">LIVE ANALYSIS</span>
            </div>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span class="status" id="status">OFFLINE</span>
            <button class="btn" id="connectBtn" onclick="connect()">CONECTAR</button>
        </div>
    </div>

    <div class="main">
        <div class="panel">
            <div class="panel-header">GRÁFICO XAU/USD M5</div>
            <div id="chart"></div>
        </div>
        <div class="panel">
            <div class="panel-header">SINAL ATUAL</div>
            <div class="signal">
                <div style="color: var(--muted); font-size: 10px;">CONFIANÇA</div>
                <div class="signal-type signal-wait" id="signalType">AGUARDAR</div>
                <div class="gold" id="confidence">0%</div>
            </div>
            <div class="levels">
                <div class="level">
                    <div class="level-label">ENTRADA</div>
                    <div class="level-value" id="entry">--.--</div>
                </div>
                <div class="level">
                    <div class="level-label">TP</div>
                    <div class="level-value green" id="tp">--.--</div>
                </div>
                <div class="level">
                    <div class="level-label">SL</div>
                    <div class="level-value red" id="sl">--.--</div>
                </div>
            </div>
            <div class="panel-header">INDICADORES</div>
            <div style="padding: 12px; display: grid; gap: 8px;">
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--muted);">RSI (14)</span>
                    <span id="rsi">--</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--muted);">MACD</span>
                    <span id="macd">--</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--muted);">ATR (14)</span>
                    <span id="atr">--</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="color: var(--muted);">EMA 9/21</span>
                    <span id="ema">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script>
        const chart = LightweightCharts.createChart(document.get.getElementById('chart'), {
            layout: { background: { color: '#111827' }, textColor: '#5a6a8a' },
            grid: { vertLines: { color: 'rgba(255,185,70,0.05)' }, horzLines: { color: 'rgba(255,185,70,0.05)' } },
            timeScale: { timeVisible: true },
            rightPriceScale: { borderColor: 'rgba(255,185,70,0.1)' }
        });
        const series = chart.addCandlestickSeries({
            upColor: '#3dffa0',
            downColor: '#ff5e6b',
            borderVisible: false,
            wickUpColor: '#3dffa0',
            wickDownColor: '#ff5e6b'
        });

        let candles = [];
        let timer = null;

        function ema(data, p) {
            const k = 2/(p+1);
            let res = [];
            data.forEach((v,i) => {
                if(i===0) res.push(v);
                else res.push(v*k + res[i-1]*(1-k));
            });
            return res;
        }

        function rsi(data, p=14) {
            if(data.length < p+1) return null;
            let gains=0, losses=0;
            for(let i=1;i<=p;i++) {
                let diff = data[i]-data[i-1];
                if(diff>=0) gains+=diff; else losses-=diff;
            }
            let avgGain=gains/p, avgLoss=loses/p;
            if(avgLoss===0) return 100;
            let rs = avgGain/avgLoss;
            return 100 - (100/(1+rs));
        }

        function atr(candles, p=14) {
            if(candles.length < p+1) return 0;
            let tr = [];
            for(let i=1;i<candles.length;i++) {
                let h=c[i].high, l=c[i].low, pc=c[i-1].close;
                tr.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)));
            }
            let sum=0;
            for(let i=0;i<p;i) sum+=tr[i];
            return sum/p;
        }

        function macd(data) {
            let e12 = ema(data,12), e26 = ema(data,26);
            let m = e12[e12.length-1]-e26[e26.length-1];
            let s = m*0.9;
            return {m,s,h:m-s};
        }

        async function fetchData() {
            try {
                document.getElementById('status').textContent = 'CARREGANDO';
                const url = 'https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=5m&range=1d';
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url));
                if(!res.ok) throw new Error('bad');
                const outer = await res.json();
                const json = JSON.parse(outer.contents);
                if(!json.chart?.result?.[0]) throw new Error('no result');
                const r = json.chart.result[0];
                const q = r.indicators.quote[0];
                const t = r.timestamp;
                candles = [];
                for(let i=0;i<t.length;i++) {
                    if(q.open[i]==null || q.close[i]==null) continue;
                    candles.push({
                        time: t[i],
                        open: Number(q.open[i]),
                        high: Number(q.high[i]),
                        low: Number(q.low[i]),
                        close: Number(q.close[i])
                    });
                }
                candles = candles.filter(c => c.open && c.close).slice(-80);
                if(candles.length < 20) throw new Error('few');
                series.setData(candles);
                chart.timeScale().fitContent();
                analyze();
                document.getElementById('status').textContent = 'LIVE';
                document.getElementById('status').classList.add('on');
                document.getElementById('connectBtn').textContent = 'ATUALIZANDO';
            } catch(e) {
                console.error('ERR', e);
                document.getElementById('status').textContent = 'ERRO';
            }
        }

        function analyze() {
            if(candles.length < 30) return;
            const close = candles.map(c => c.close);
            const last = close[close.length-1];
            const e9 = ema(close,9)[close.length-1];
            const e21 = ema(close,21)[close.length-1];
            const r = rsi(close);
            const a = atr(candles);
            const m = macd(close);

            document.getElementById('rsi').textContent = r ? r.toFixed(1) : '--';
            document.getElementById('atr').textContent = a.toFixed(2);
            document.getElementById('macd').textContent = m.h.toFixed(3);
            document.getElementById('ema').textContent = e9.toFixed(2) + ' / ' + e21.toFixed(2);

            let signal = 'AGUARDAR';
            let cls = 'signal-wait';
            let conf = 0;
            let entry = last, tp = last, sl = last;

            if(e9 > e21 && r >= 40 && r <= 65) {
                signal = 'COMPRAR';
                cls = 'signal-buy';
                conf = 82;
                entry = last;
                sl = last - a * 1.4;
                tp = last + a * 2.2;
            } else if(e9 < e21 && r >= 35 && r <= 60) {
                signal = 'VENDER';
                cls = 'signal-sell';
                conf = 82;
                entry = last;
                sl = last + a * 1.4;
                tp = last - a * 2.2;
            } else if(e9 > e21 && r < 40) {
                signal = 'COMPRAR';
                cls = 'signal-buy';
                conf = 70;
                entry = last;
                sl = last - a * 1.4;
                tp = last + a * 2.2;
            } else if(e9 < e21 && r > 60) {
                signal = 'VENDER';
                cls = 'signal-sell';
                conf = 70;
                entry = last;
                sl = last + a * 1.4;
                tp = last - a * 2.2;
            }

            document.getElementById('signalType').textContent = signal;
            document.getElementById('signalType').className = 'signal-type ' + cls;
            document.getElementById('confidence').textContent = conf + '%';
            document.getElementById('entry').textContent = entry.toFixed(2);
            document.getElementById('tp').textContent = tp.toFixed(2);
            document.getElementById('sl').textContent = sl.toFixed(2);
        }

        window.connect = function() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.textContent = 'CONECTANDO...';
            if(timer) clearInterval(timer);
            fetchData();
            timer = setInterval(fetchData, 60000);
        }

        window.addEventListener('load', () => {
            setTimeout(connect, 1000);
        });
    </script>
</body>
</html>
